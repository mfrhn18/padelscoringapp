<style>
:root{--bg:#f7f8fb;--card:#fff;--ink:#171a22;--muted:#6c778a;--line:#e4e8ef;--soft:#eef2f8;--purple:#5649df;--purple2:#aaa4f5;--navy:#11182d;--green:#269566;--red:#b94b55;--maroon:#8f2d3b;--gold:#d79b13}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Helvetica,Arial,sans-serif;font-weight:400}button,input,select{font:inherit}button{touch-action:manipulation}body{min-height:100vh}.app{max-width:780px;margin:auto;padding:12px 12px calc(94px + env(safe-area-inset-bottom))}.top{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin:0 -12px 18px;padding:0 15px;background:#fff}.logo{font-weight:700;letter-spacing:2px;font-size:16px}.logo span{color:var(--purple)}.btn{border:0;border-radius:13px;padding:9px 14px;min-height:40px;font-size:13px;font-weight:600}.primary{background:var(--navy);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.hero{margin-bottom:18px}.hero h1{font-size:22px;font-weight:500;letter-spacing:-.6px;margin:0 0 4px}.muted{color:var(--muted)}.small{font-size:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:11px;box-shadow:0 3px 14px rgba(20,30,50,.025)}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.tabs{display:flex;background:#edf2f8;border-radius:17px;padding:3px;margin:10px 0 16px}.tab{flex:1;border:0;background:transparent;color:#70798a;min-height:46px;border-radius:14px;font-size:16px;font-weight:400}.tab.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(20,30,50,.07)}.session-head{padding:0 5px 12px}.session-title{font-size:20px;font-weight:500;letter-spacing:-.5px;margin:0 0 4px}.session-type{font-size:15px;color:var(--purple);margin-bottom:6px}.session-meta{font-size:12px;color:#737c8a}.roundbar{display:flex;align-items:center;gap:7px;margin:3px 5px 10px}.roundtitle{font-size:18px;font-weight:500;letter-spacing:-.4px}.help{width:29px;height:29px;border:2px solid #9aa6b9;background:transparent;border-radius:50%;color:#7b879a;font-weight:700;font-size:12px}.rounds{display:flex;gap:7px;overflow:auto;padding:2px 3px 10px}.roundpill{min-width:44px;height:44px;border:0;border-radius:50%;background:#e5eaf2;color:#52617a;font-size:12px}.roundpill.active{background:var(--purple);color:#fff}.match{background:#fff;border:1px solid var(--line);border-radius:19px;margin:0 0 12px;padding:0 10px 10px;box-shadow:0 4px 15px rgba(20,30,50,.035);overflow:visible}.court-row{height:32px;display:flex;justify-content:flex-end;align-items:flex-start}.court{background:#eef2f8;color:#6d7a90;border-radius:0 0 0 15px;padding:7px 9px;font-size:11px}.match-grid{display:grid;grid-template-columns:1fr 88px 1fr;align-items:center;gap:4px;min-height:98px}.team{font-size:12px;line-height:1.55;font-weight:400}.team.right{text-align:right}.playernum{display:inline-flex;width:23px;height:23px;align-items:center;justify-content:center;border-radius:50%;background:#e9edf4;color:#5e6b80;font-size:10px;margin:0 2px;font-weight:600}.score-pair{display:flex;gap:4px;justify-content:center}.score-pair button{width:39px;height:45px;border:0;border-radius:9px;background:var(--navy);color:#fff;font-size:21px;font-weight:500}.score-pair button.set{background:var(--purple)}.match-actions{display:flex;gap:6px}.match-actions button{flex:1;min-height:33px;border:0;border-radius:9px;background:#f5f7fa;color:#5f6c80;font-size:10px;font-weight:600}.rest-pill,.away-pill{display:inline-flex;align-items:center;border-radius:999px;padding:7px 11px;font-size:12px;margin:1px 0 11px}.rest-pill{border:1px solid #dbe1e9;color:#68758a;background:#fff}.away-pill{border:1px solid #e7b4bd;color:var(--maroon);background:#fff0f2}.bottom-action{position:fixed;left:0;right:0;bottom:0;padding:9px 15px calc(9px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:1px solid var(--line);backdrop-filter:blur(10px);z-index:20}.bottom-action button{width:100%;height:53px;border:0;border-radius:28px;background:linear-gradient(135deg,#5146d8,#8b5cf6,#ec4899);color:#fff;font-size:19px;font-weight:500}.bottom-action button:disabled{background:#d8dce4;color:#8b95a5;opacity:1}.leaderboard{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.leader-head,.leader-row{display:grid;grid-template-columns:27px minmax(118px,1fr) 43px 43px 68px 45px;gap:4px;align-items:center;padding:10px 9px}.leader-head{font-size:9px;color:#6d7a90;background:#f8f9fc;font-weight:600}.leader-row{font-size:12px;border-top:1px solid #edf0f4}.leader-row.me{background:#fffdf0}.rank{font-size:12px;color:#647087}.name-btn{border:0;background:transparent;padding:0;text-align:left;color:var(--ink);font-size:12px}.name-btn:hover{text-decoration:underline}.badge{display:inline-flex;justify-content:center;align-items:center;border-radius:999px;padding:4px 6px;background:#eaf0f7;color:#52617a;font-size:10px}.badge.court{background:#e4f0ff;color:#4a7bb8}.badge.rest{background:#e9edf3}.badge.away{background:#fff0f2;color:var(--maroon)}.wl{font-size:11px;white-space:nowrap}.wl .w{color:var(--green)}.wl .l{color:var(--red)}.points{font-weight:600}.panel{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;align-items:flex-end;z-index:50}.sheet{width:min(780px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 15px calc(22px + env(safe-area-inset-bottom))}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.sheet-head h2{font-size:21px;font-weight:500;margin:0}.close{width:36px;height:36px;border:0;border-radius:50%;background:#f0f2f5;font-size:21px}.score-title{font-size:22px;font-weight:500;margin:0 0 2px}.score-sub{font-size:12px;color:var(--muted);margin-bottom:13px}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.score-grid button{min-height:55px;border:0;border-radius:11px;background:var(--navy);color:#fff;font-size:20px;font-weight:500}.score-grid button.selected{background:var(--purple)}.pair-label{font-size:11px;color:var(--muted);margin:11px 0 6px}.field{margin-bottom:12px}.field label{display:block;font-size:9px;color:#627087;font-weight:600;margin-bottom:5px}.field input,.field select{width:100%;height:42px;border:1px solid #d6dbe3;border-radius:10px;padding:7px 9px;background:#fff;font-size:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:600}.chip.sel{background:#efefff;border-color:#9b96ee;color:#3f39a8}.playerline{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.playerline .name{flex:1;font-size:13px}.status{border:0;border-radius:8px;padding:6px 9px;font-size:10px;font-weight:600}.status.active{background:#eaf8f0;color:#248052}.status.away{background:#fff0f0;color:#c84d4d}.is-locked{opacity:.55;cursor:not-allowed!important}.readonly-note{padding:9px 10px;border-radius:11px;background:#f6f7fa;color:#667286;font-size:11px;margin-bottom:11px}.team-input{display:grid;grid-template-columns:34px 1fr;gap:7px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.team-input input{width:100%;height:42px;border:1px solid #d6dbe3;border-radius:10px;padding:7px 9px;background:#fff;font-size:13px}.team-input input+input{grid-column:2}.team-tag{font-size:10px;color:#68758a;font-weight:700}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}.stat{background:#f7f8fb;border:1px solid var(--line);border-radius:13px;padding:10px}.stat b{display:block;font-size:18px;font-weight:500}.stat span{font-size:10px;color:var(--muted)}.history{border-top:1px solid var(--line);margin-top:10px}.history-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef1f5;font-size:11px}.result-win{color:var(--green);font-weight:700}.result-loss{color:var(--red);font-weight:700}.result-tie{color:#9b7b20;font-weight:700}.partner-chart{margin-top:8px}.partner-row{display:grid;grid-template-columns:1fr 50px;gap:8px;align-items:center;margin:8px 0}.partner-name{font-size:11px}.bar-wrap{height:8px;background:#edf0f5;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#5146d8,#a78bfa);border-radius:999px}.partner-count{text-align:right;font-size:10px;color:var(--muted)}.notice{padding:9px 10px;border-radius:11px;background:#f6f7fa;color:#667286;font-size:11px;margin-bottom:11px}.team-lock{padding:9px 10px;border-radius:11px;background:#f0efff;color:#4c43c5;font-size:11px;margin-bottom:11px}.toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:11px;padding:9px 12px;font-size:11px;font-weight:600;z-index:80;display:none;white-space:nowrap}.session-status{font-size:10px;text-transform:uppercase;letter-spacing:.5px}.finished{color:#647087}.live{color:var(--green)}
@media(max-width:520px){.match-grid{grid-template-columns:1fr 82px 1fr}.team{font-size:12px}.score-pair button{width:35px;height:44px}.leader-head,.leader-row{grid-template-columns:23px minmax(100px,1fr) 39px 38px 64px 39px;font-size:11px}.leader-head{font-size:9px}.stat-grid{grid-template-columns:repeat(2,1fr)}}

.add-player-box{padding:12px;border:1px solid var(--line);border-radius:14px;background:#f8f9fc;margin-bottom:10px}.add-player-box input{width:100%;height:42px;border:1px solid #d6dbe3;border-radius:10px;padding:7px 9px;background:#fff;font-size:13px}.setup-count{font-size:10px;color:var(--muted);font-weight:600;margin:8px 0}.playerline.vertical{display:flex;flex-direction:column;align-items:stretch;gap:7px;padding:10px 0;border-bottom:1px solid var(--line)}.playerline.vertical input{height:42px;border:1px solid var(--line);border-radius:11px;padding:8px 10px}.player-attrs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.player-attrs select{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 8px}.player-rank{display:inline-block;min-width:24px;color:var(--purple);font-size:10px;font-weight:700}.public-head{padding:12px 4px 8px}.public-head h1{font-size:25px;font-weight:500;margin:18px 0 4px}.public-head .session-type{font-size:14px}.public-head .logo{font-size:13px}
.fab{position:fixed;right:18px;bottom:84px;width:58px;height:58px;border:0;border-radius:50%;background:linear-gradient(135deg,#5146d8,#ec4899);color:#fff;font-size:30px;line-height:58px;box-shadow:0 8px 24px rgba(81,70,216,.28);z-index:25}.fab:active{transform:scale(.96)}.pair-list{margin-top:12px}.pair-card{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 11px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;background:#fafbfc}.pair-card .pair-name{font-size:12px}.pair-card .pair-label{margin:0 0 3px;font-size:9px;font-weight:700;color:#68758a;text-transform:uppercase;letter-spacing:.4px}
.share-choice{display:grid;gap:9px}.share-choice button{width:100%;min-height:58px;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:left;padding:11px 13px;display:flex;align-items:center;gap:11px}.share-choice button strong{display:block;font-size:14px}.share-choice button span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.share-choice .choice-icon{font-size:23px;width:30px;text-align:center}.template-stage{background:#eef1f5;border-radius:18px;padding:12px}.template-preview{width:100%;aspect-ratio:9/16;display:block;border-radius:12px;background:#20242b}.template-dots{display:flex;justify-content:center;gap:7px;margin:11px 0 2px}.template-dot{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:#c4c9d1}.template-dot.active{background:var(--purple)}.image-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.image-actions .btn{width:100%}.photo-input{display:none}.font-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.template-name{font-size:13px;font-weight:600;margin:0 0 4px}.template-desc{font-size:10px;color:var(--muted);margin-bottom:10px}
</style>

<body>
<div class="app"><header class="top"><div class="logo"><span>●●●</span> PADEL ROUND</div></header><div id="view"></div></div>
<div id="panel" class="panel" onclick="if(event.target===this)closePanel()"><section id="sheet" class="sheet"></section></div><div id="toast" class="toast"></div>
<script>
const KEY='padel-round-v1';
const raw=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('padel-round-v10')||localStorage.getItem('padel-round-v09')||localStorage.getItem('padel-round-v08')||localStorage.getItem('padel-round-v07')||localStorage.getItem('padel-round-v06')||localStorage.getItem('padel-round-v05')||localStorage.getItem('padel-round-v04')||'{"sessions":[],"current":null}');
const S=(raw&&Array.isArray(raw.sessions))?raw:{sessions:[],current:null}; let setup={type:'Mexicano',rank:'wins',name:'',courts:1,players:4,scoreMode:'points',scoreRule:'points-21',place:'',constraint:'gender'};
const TYPES=['Americano','Mexicano','Mixicano','Team Americano','Team Mexicano']; const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(S))} function cur(){return S.sessions.find(x=>x.id===S.current)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(window.__t);window.__t=setTimeout(()=>e.style.display='none',1600)}
function openPanel(h){$('sheet').innerHTML=h;$('panel').style.display='flex'} function closePanel(){$('panel').style.display='none'}
function isTeam(s){return s.type.startsWith('Team ')} function isAmericano(s){return s.type.includes('Americano')} function isMexicano(s){return s.type.includes('Mexicano')} function isMixicano(s){return s.type==='Mixicano'} function pairConstraint(s){return s.pairConstraint||setup.constraint||'gender'}
function scoreLimit(s){return +(s.scoreRule||'points-21').split('-')[1]||21}
function ruleText(s){const n=scoreLimit(s);return s.scoreMode==='points'?`Play until ${n} points`:`${(s.scoreRule||'race-4').startsWith('total')?'Total of':'Race to'} ${n} games`}
function ensureSession(s){if(!s)return;s.partnerHistory=s.partnerHistory||{};s.opponentHistory=s.opponentHistory||{};s.teamHistory=s.teamHistory||{};s.restCount=s.restCount||{};s.restStreak=s.restStreak||{};s.rounds=s.rounds||[];s.matches=s.matches||[];s.players=s.players||[];s.teams=s.teams||[];s.pairConstraint=s.pairConstraint||'gender';s.players.forEach(p=>{p.gender=p.gender||'';p.side=p.side||'';p.active=p.active!==false;p.w=p.w||0;p.l=p.l||0;p.ties=p.ties||0;p.p=p.p||0;p.played=p.played||0;p.diff=p.diff||0;p.restCount=p.restCount||0;p.restStreak=p.restStreak||0});
 if(isTeam(s)&&!s.teams.length){for(let i=0;i<s.players.length;i+=2)s.teams.push({id:Math.floor(i/2)+1,name:'Team '+(Math.floor(i/2)+1),playerIds:s.players.slice(i,i+2).map(p=>p.id)})}
}
S.sessions.forEach(ensureSession);
function rankVal(p,s){return s.rank==='wins'?p.w*100000+p.p:p.p*100+p.w}
function standingsScore(p,mode){return mode==='wins'?p.w*100000+p.p*100+p.played:p.p*100000+p.w*100+p.played}
function teamStandings(s,mode){return (s.teams||[]).map(t=>{const ps=t.playerIds.map(id=>s.players.find(p=>p.id===id)).filter(Boolean);return {team:t,name:ps.map(p=>p.name).join(' / '),played:ps[0]?.played||0,w:ps[0]?.w||0,l:ps[0]?.l||0,ties:ps[0]?.ties||0,p:ps[0]?.p||0}}).sort((a,b)=>mode==='wins'?(b.w-a.w)||(b.p-a.p):(b.p-a.p)||(b.w-a.w))}
function leaderboardSortLabel(mode){return mode==='wins'?'wins':'points'}
function leaderboard(mode){const s=cur();mode=mode||s.leaderboardSort||s.rank||'points';s.leaderboardSort=mode;const team=isTeam(s);if(team&&(!s.teams||!s.teams.length)){s.teams=[];for(let i=0;i<s.players.length;i+=2)if(s.players[i+1])s.teams.push({id:i/2+1,name:'Team '+(i/2+1),playerIds:[s.players[i].id,s.players[i+1].id]});save()}const arr=team?teamStandings(s,mode):[...s.players].sort((a,b)=>standingsScore(b,mode)-standingsScore(a,mode));openPanel(`<div class="sheet-head"><div><h2>Leaderboard</h2><div class="small muted">Standings sorted by ${leaderboardSortLabel(mode).toLowerCase()}</div></div><button class="close" onclick="closePanel()">×</button></div><div class="chips" style="margin-bottom:10px"><button class="chip ${mode==='wins'?'sel':''}" onclick="leaderboard('wins')">Wins</button><button class="chip ${mode==='points'?'sel':''}" onclick="leaderboard('points')">Points</button></div><div class="leaderboard"><div class="leader-head"><span>#</span><span>${team?'Team':'Player'}</span><span>Now</span><span>G</span><span>W-L-T</span><span>P</span></div>${arr.map((p,i)=>{if(team){const active=s.matches.find(m=>p.team.playerIds.some(id=>(m.t1||[]).includes(id)||(m.t2||[]).includes(id)));const now=active?`C${active.court}`:'—';return `<div class="leader-row ${i===0?'me':''}"><span class="rank">${i+1}</span><button class="name-btn" onclick="playerStats(${p.team.playerIds[0]})">${esc(p.name)}</button><span class="badge ${active?'court':'rest'}">${now}</span><span>${p.played}</span><span class="wl"><span class="w">${p.w}</span>-<span class="l">${p.l}</span>-<span>${p.ties}</span></span><span class="points">${p.p}</span></div>`}const activeMatch=s.matches.find(m=>m.t1.includes(p.id)||m.t2.includes(p.id));const court=activeMatch?`C${activeMatch.court}`:(awayPlayers(s).some(x=>x.id===p.id)?'Away':((s.rest||[]).includes(p.id)?'Rest':'—'));return `<div class="leader-row ${i===0?'me':''}"><span class="rank">${i+1}</span><button class="name-btn" onclick="playerStats(${p.id})">${esc(p.name)}</button><span class="badge ${activeMatch?'court':court==='Away'?'away':'rest'}">${court}</span><span>${p.played}</span><span class="wl"><span class="w">${p.w}</span>-<span class="l">${p.l}</span>-<span>${p.ties}</span></span><span class="points">${p.p}</span></div>`}).join('')}</div>`)}function captureCreate(){setup.name=$('sn')?.value||setup.name;setup.courts=+$('ct')?.value||setup.courts;setup.players=+$('pc')?.value||setup.players;setup.scoreMode=$('sm')?.value||setup.scoreMode;setup.scoreRule=$('sr')?.value||setup.scoreRule;setup.place=$('pl')?.value||setup.place}
function activePlayers(s){return s.players.filter(p=>p.active)}
function currentMatchIds(s){return new Set(s.matches.flatMap(m=>[...(m.t1||[]),...(m.t2||[])].filter(Boolean)))}
function dynamicRest(s){const ids=currentMatchIds(s);return activePlayers(s).filter(p=>!ids.has(p.id)).map(p=>p.id)}
function openCreate(reset=true){if(reset)setup={type:'Mexicano',rank:'wins',name:'',courts:1,players:0,scoreMode:'points',scoreRule:'points-21',place:'',constraint:'gender'};openPanel(`<div class="sheet-head"><h2>New session</h2><button class="close" onclick="closePanel()">×</button></div>
<div class="field"><label>SESSION NAME</label><input id="sn" value="${esc(setup.name)}" placeholder="Friday Night Padel"></div>
<div class="field"><label>MATCH TYPE</label><select id="mt" onchange="captureCreate();setup.type=this.value;openCreateKeep()">${TYPES.map(x=>`<option value="${x}" ${setup.type===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>COURTS</label><select id="ct">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${setup.courts===i+1?'selected':''}>${i+1}</option>`).join('')}</select></div>
<div class="field"><label>SCORING TYPE</label><select id="sm" onchange="captureCreate();scoreRules()"><option value="points" ${setup.scoreMode==='points'?'selected':''}>Points</option><option value="normal" ${setup.scoreMode==='normal'?'selected':''}>Normal Scoring</option></select></div><div class="field"><label>FINISH RULE</label><select id="sr"></select></div>
<div class="field"><label>PLACE</label><input id="pl" value="${esc(setup.place)}" placeholder="Padel club / venue"></div>${setup.type==='Mixicano'?`<div class="field"><label>PAIRING CONSTRAINT</label><select id="pcn" onchange="captureCreate();setup.constraint=this.value;openCreateKeep()"><option value="gender" ${setup.constraint==='gender'?'selected':''}>Gender · Male + Female</option><option value="side" ${setup.constraint==='side'?'selected':''}>Playing side · Left + Right</option></select></div>`:''}<div class="field"><label>RANKING</label><select id="rk" onchange="captureCreate();setup.rank=this.value;openCreateKeep()"><option value="wins" ${setup.rank==='wins'?'selected':''}>Sort by wins</option><option value="points" ${setup.rank==='points'?'selected':''}>Sort by points</option></select></div>
${isTeam({type:setup.type})?'<div class="team-lock">Team match: players are entered as fixed pairs, two names at a time.</div>':''}${setup.type==='Mixicano'?'<div class="team-lock">Mixicano: every pair must contain one player from each selected category.</div>':''}<button class="btn primary" style="width:100%" onclick="create()">Continue → players</button>`);scoreRules()}

function shareId(){const a=new Uint8Array(20);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,26)}
async function createRemoteShare(s){
  const snapshot=sessionSnapshot(s);
  const res=await fetch('/.netlify/functions/share-create',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(snapshot)});
  let data=null;try{data=await res.json()}catch(e){}
  if(!res.ok||!data?.id)throw new Error(data?.error||'Unable to create share link');
  s.shareId=data.id;save();
  return location.origin+'/results/'+data.id;
}

function fitCover(ctx,img,w,h){const scale=Math.max(w/img.width,h/img.height);const sw=w/scale,sh=h/scale;const sx=(img.width-sw)/2,sy=(img.height-sh)/2;ctx.drawImage(img,sx,sy,sw,sh,0,0,w,h)}

function drawImagePreview(){

}
function drawTemplate(ctx,W,H,s,rows,t){ctx.save();const font=imageShareState.font||t.font||'Helvetica';ctx.fillStyle='rgba(0,0,0,.44)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font=`700 22px ${font}`;ctx.fillText('PADEL ROUND',70,76);ctx.textAlign='center';ctx.font=`700 ${t.titleSize}px ${font}`;ctx.fillText(s.name||'Padel Session',W/2,170);ctx.font=`400 22px ${font}`;ctx.globalAlpha=.92;ctx.fillText(imageMeta(s),W/2,210);ctx.globalAlpha=1;if(imageShareState.index===0)drawClassic(ctx,W,H,rows,font);else if(imageShareState.index===1)drawPodium(ctx,W,H,rows,font);else drawCompact(ctx,W,H,rows,font);ctx.restore()}
function drawClassic(ctx,W,H,rows,font){const start=350;ctx.textAlign='left';ctx.font=`700 20px ${font}`;ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillText('TOP 3 LEADERBOARD',70,start-35);rows.forEach(p=>{const y=start+(p.rank-1)*245;roundRect(ctx,55,y,W-110,190,26);ctx.fillStyle='rgba(255,255,255,.94)';ctx.fill();ctx.fillStyle='#1b2430';ctx.font=`700 25px ${font}`;ctx.fillText(`${p.rank}`,85,y+52);ctx.font=`700 32px ${font}`;ctx.fillText(p.name,150,y+52);ctx.font=`400 22px ${font}`;ctx.fillText(`${p.w}-${p.l}-${p.ties} · ${p.played} games`,150,y+96);ctx.font=`700 34px ${font}`;ctx.fillText(`${p.p} PTS`,150,y+148)})}
function drawPodium(ctx,W,H,rows,font){const base=1450;const slots=[{p:rows[1],x:W*.23,h:430,color:'#e6edf5'},{p:rows[0],x:W*.5,h:560,color:'#ffd45c'},{p:rows[2],x:W*.77,h:350,color:'#e7a04b'}];ctx.textAlign='center';slots.forEach(({p,x,h,color})=>{if(!p)return;const y=base-h;ctx.fillStyle=color;roundRect(ctx,x-145,y,290,h,28);ctx.fill();ctx.fillStyle='#fff';ctx.font=`700 34px ${font}`;ctx.fillText(String(p.rank),x,y+58);ctx.fillStyle='#1b2430';ctx.font=`700 30px ${font}`;ctx.fillText(p.name,x,y+120);ctx.font=`400 22px ${font}`;ctx.fillText(`${p.w}-${p.l}-${p.ties}`,x,y+160);ctx.font=`700 29px ${font}`;ctx.fillText(`${p.p} PTS`,x,y+205)})}
function drawCompact(ctx,W,H,rows,font){const x=65,y=420,w=W-130;ctx.textAlign='left';ctx.fillStyle='rgba(255,255,255,.94)';roundRect(ctx,x,y,w,390,26);ctx.fill();ctx.fillStyle='#1b2430';ctx.font=`700 21px ${font}`;ctx.fillText('#',x+25,y+48);ctx.fillText('PLAYER',x+90,y+48);ctx.fillText('W-L-T',x+w-300,y+48);ctx.fillText('P',x+w-90,y+48);rows.forEach((p,i)=>{const yy=y+105+i*92;ctx.font=`700 27px ${font}`;ctx.fillText(String(p.rank),x+25,yy);ctx.fillText(p.name,x+90,yy);ctx.font=`400 22px ${font}`;ctx.fillText(`${p.w}-${p.l}-${p.ties}`,x+w-300,yy);ctx.font=`700 27px ${font}`;ctx.fillText(String(p.p),x+w-90,yy)})}

function publicStats(s,id){const p=s.players.find(x=>x.id===id);if(!p)return;const matches=(s.rounds||[]).flatMap(r=>(r.matches||[]).map(m=>({...m,round:r.number}))).filter(m=>[...(m.t1||[]),...(m.t2||[])].includes(id));const partnerStats={};matches.forEach(m=>{const side=m.t1.includes(id)?0:1,team=side===0?m.t1:m.t2,my=m.pairScore?.[side],opp=m.pairScore?.[1-side];if(my==null||opp==null)return;team.filter(x=>x!==id).forEach(x=>{const st=partnerStats[x]||{games:0,wins:0,losses:0,ties:0};st.games++;if(my>opp)st.wins++;else if(my<opp)st.losses++;else st.ties++;partnerStats[x]=st})});let rows=Object.entries(partnerStats);const reliable=rows.filter(([,st])=>st.games>=2);if(reliable.length)rows=reliable;rows.sort((a,b)=>{const ar=a[1].games?a[1].wins/a[1].games:0,br=b[1].games?b[1].wins/b[1].games:0;return (br-ar)||(b[1].games-a[1].games)||(b[1].wins-a[1].wins)});rows=rows.slice(0,5);const maxRate=rows[0]?.[1].games?rows[0][1].wins/rows[0][1].games:1;const history=matches.slice().reverse().slice(0,15).map(m=>{const side=m.t1.includes(id)?0:1,my=m.pairScore?.[side]??0,opp=m.pairScore?.[1-side]??0;const partner=(side?m.t2:m.t1).filter(x=>x!==id).map(x=>s.players.find(p=>p.id===x)?.name).join(' & ');return `<div class="history-row"><span>R${m.round} · ${esc(partner||'Solo')}</span><span>${my}-${opp} <b class="${my>opp?'result-win':my<opp?'result-loss':'result-tie'}">${my>opp?'W':my<opp?'L':'T'}</b></span></div>`}).join('');openPanel(`<div class="sheet-head"><div><h2>${esc(p.name)}</h2><div class="small muted">Player statistics · Read-only</div></div><button class="close" onclick="closePanel()">×</button></div><div class="stat-grid"><div class="stat"><b>${p.played}</b><span>Games played</span></div><div class="stat"><b>${p.w}</b><span>Wins</span></div><div class="stat"><b>${p.l}</b><span>Losses</span></div><div class="stat"><b>${p.ties}</b><span>Ties</span></div><div class="stat"><b>${p.played?Math.round(p.w/p.played*100):0}%</b><span>Win rate</span></div><div class="stat"><b>${p.p}</b><span>Points</span></div></div><h3 style="font-size:14px;font-weight:500;margin:5px 0 7px">Match history</h3><div class="history">${history||'<div class="notice">No completed matches yet.</div>'}</div><h3 style="font-size:14px;font-weight:500;margin:16px 0 7px">Best partners</h3>${isTeam(s)?`<div class="team-lock">Fixed team partner: ${esc((s.teams.find(t=>t.playerIds.includes(id))?.playerIds||[]).filter(x=>x!==id).map(x=>s.players.find(q=>q.id===x)?.name).join(' & ')||'—')}</div>`:''}<div class="partner-chart">${rows.length?rows.map(([pid,st])=>{const n=s.players.find(x=>x.id===+pid)?.name||'Unknown';const rate=st.games?Math.round(st.wins/st.games*100):0;const width=maxRate?Math.round((st.wins/st.games)/maxRate*100):0;return `<div class="partner-row"><div><div class="partner-name">${esc(n)}</div><div class="bar-wrap"><div class="bar" style="width:${width}%"></div></div></div><div class="partner-count">${rate}% · ${st.games}g</div></div>`}).join(''):'<div class="notice">No partner history yet.</div>'}</div>`)}
function renderPublicResults(s){recalcStats(s);const team=isTeam(s);if(team&&(!s.teams||!s.teams.length)){s.teams=[];for(let i=0;i<s.players.length;i+=2)if(s.players[i+1])s.teams.push({id:i/2+1,name:'Team '+(i/2+1),playerIds:[s.players[i].id,s.players[i+1].id]})}const arr=team?teamStandings(s,s.rank||'points'):[...s.players].sort((a,b)=>standingsScore(b,s.rank||'points')-standingsScore(a,s.rank||'points'));$('view').innerHTML=`<div class="public-head"><div class="logo"><span>●●●</span> PADEL ROUND</div><h1>${esc(s.name)}</h1><div class="session-type">${esc(s.type)}${isMixicano(s)?' · '+(s.pairConstraint==='side'?'Left + Right':'Male + Female'):''}</div><div class="session-meta">${s.playerCount} players · ${s.courts} courts${s.place?' · '+esc(s.place):''}</div><div class="notice" style="margin-top:12px">Finished session · Read-only results</div></div><section class="card"><div class="row"><h2 style="margin:0;font-size:18px">Leaderboard</h2><button class="btn secondary" onclick="sharePublic()">Share</button></div><div class="leaderboard" style="margin-top:10px"><div class="leader-head"><span>#</span><span>${team?'Team':'Player'}</span><span>G</span><span>W-L-T</span><span>P</span></div>${arr.map((p,i)=>{const name=team?p.name:p.name;const clickId=team?p.team.playerIds[0]:p.id;return `<div class="leader-row" style="grid-template-columns:23px minmax(120px,1fr) 38px 64px 39px"><span class="rank">${i+1}</span><button class="name-btn" onclick="publicStats(${clickId})">${esc(name)}</button><span>${p.played}</span><span>${p.w}-${p.l}-${p.ties}</span><span class="points">${p.p}</span></div>`}).join('')}</div></section><section class="card"><h2 style="font-size:18px;margin:0 0 10px">Match Results</h2>${(s.rounds||[]).map(r=>`<details ${r.number===1?'open':''}><summary>Round #${r.number}</summary>${r.matches.map(m=>`<div class="history-row"><span>${m.t1.map(id=>esc(s.players.find(p=>p.id===id)?.name||'—')).join(' / ')} <b>${m.pairScore?.[0]??'--'}-${m.pairScore?.[1]??'--'}</b> ${m.t2.map(id=>esc(s.players.find(p=>p.id===id)?.name||'—')).join(' / ')}</span><span>Court ${m.court}</span></div>`).join('')}</details>`).join('')}</section>`}function sharePublic(){const url=location.href;const title=document.title||'Padel Round results';if(navigator.share){navigator.share({title,text:'View the finished session results',url}).catch(()=>{})}else{navigator.clipboard?.writeText(url).then(()=>toast('Link copied'))}}

function openSessionCard(e,id){if(e?.target?.closest('button'))return;S.current=id;save();render()}function addPlayers(){const s=cur();if(!s)return;const team=isTeam(s),mix=isMixicano(s);const a=$('newp1'),b=$('newp2');const n1=(a?.value||'').trim(),n2=(b?.value||'').trim();if(team){if(!n1||!n2)return toast('Enter both player names');addPlayerRecord(s,n1);addPlayerRecord(s,n2)}else{if(!n1)return toast('Enter a player name');const p=addPlayerRecord(s,n1);if(mix){p.gender=$('newgender')?.value||'';p.side=$('newside')?.value||'';if(!p.gender||!p.side){s.players=s.players.filter(x=>x.id!==p.id);s.playerCount=s.players.length;return toast('Set gender and side first')}}}s.playerCount=s.players.length;save();playersSetup(s)}

function newRound(){const s=cur();s.round++;const active=activePlayers(s);if(isMixicano(s)){const pick=chooseMixPlayers(s,active);pick.rest.forEach(p=>{p.restCount++;p.restStreak++});pick.playing.forEach(p=>p.restStreak=0);const key=s.pairConstraint==='side'?'side':'gender';const groups={};pick.playing.forEach(p=>(groups[p[key]]=groups[p[key]]||[]).push(p));const names=Object.keys(groups);groups[names[0]]?.sort((a,b)=>rankVal(a,s)-rankVal(b,s));groups[names[1]]?.sort((a,b)=>rankVal(a,s)-rankVal(b,s));const matches=[];let pool=pick.playing.slice();while(pool.length>=4){let best=null;for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++)if(validPairMix(pool[i],pool[j],s))for(let k=0;k<pool.length;k++)if(k!==i&&k!==j)for(let l=k+1;l<pool.length;l++)if(l!==i&&l!==j&&validPairMix(pool[k],pool[l],s)){const ids=[i,j,k,l];if(new Set(ids).size<4)continue;const score=mixScore(pool[i],pool[j],s)+mixScore(pool[k],pool[l],s)+Math.abs(rankVal(pool[i],s)+rankVal(pool[j],s)-rankVal(pool[k],s)-rankVal(pool[l],s));if(!best||score<best.score)best={score,ids,pairs:[[pool[i],pool[j]],[pool[k],pool[l]]]}}if(!best)break;const [a,b,c,d]=best.ids.map(x=>pool[x]);matches.push({court:matches.length+1,t1:[a.id,b.id],t2:[c.id,d.id],pairScore:[null,null]});pool=pool.filter((_,idx)=>!best.ids.includes(idx))}s.matches=matches;s.rest=pick.rest.map(p=>p.id);s.currentRound={number:s.round,matches:s.matches,restIds:s.rest};return}
const playCount=Math.min(active.length,s.courts*4);const rankedForPlay=active.slice().sort((a,b)=>{if(a.played!==b.played)return a.played-b.played;if(a.restStreak!==b.restStreak)return b.restStreak-a.restStreak;if(a.restCount!==b.restCount)return b.restCount-a.restCount;return rankVal(b,s)-rankVal(a,s)});const playing=rankedForPlay.slice(0,playCount);const playingIds=new Set(playing.map(p=>p.id));const restIds=active.filter(p=>!playingIds.has(p.id)).map(p=>p.id);active.forEach(p=>{if(restIds.includes(p.id)){p.restCount++;p.restStreak++}else p.restStreak=0});const matches=[];for(let i=0;i+3<playing.length;i+=4){const g=playing.slice(i,i+4);let best=null;const perms=[[0,3,1,2],[0,2,1,3],[0,1,2,3]];for(const [a,b,c,d] of perms){const A=g[a],B=g[b],C=g[c],D=g[d];const repeat=(s.partnerHistory?.[A.id]?.[B.id]||0)+(s.partnerHistory?.[C.id]?.[D.id]||0);const opp=(s.opponentHistory?.[A.id]?.[C.id]||0)+(s.opponentHistory?.[A.id]?.[D.id]||0)+(s.opponentHistory?.[B.id]?.[C.id]||0)+(s.opponentHistory?.[B.id]?.[D.id]||0);const gap=Math.abs(rankVal(A,s)+rankVal(B,s)-rankVal(C,s)-rankVal(D,s));const sc=repeat*1000+opp*15+gap;if(!best||sc<best.sc)best={sc,A,B,C,D}}matches.push({court:matches.length+1,t1:[best.A.id,best.B.id],t2:[best.C.id,best.D.id],pairScore:[null,null]})}s.matches=matches;s.rest=restIds;s.currentRound={number:s.round,matches:s.matches,restIds}}

function teamGameCount(s,t){return t.playerIds.reduce((sum,id)=>sum+(s.players.find(p=>p.id===id)?.played||0),0)/Math.max(1,t.playerIds.length)}

    const sa=teamRestStreak(s,a), sb=teamRestStreak(s,b);
    if(sa!==sb)return sb-sa; // a team that just rested gets priority to play
    const ra=teamRestCount(s,a), rb=teamRestCount(s,b);
    if(ra!==rb)return rb-ra; // more historical rests gets priority to play
    const rankA=teamRank(a,s), rankB=teamRank(b,s);

function teamPairingOptions(teams){
  if(teams.length===4){const [a,b,c,d]=teams;return [ [[a,b],[c,d]], [[a,c],[b,d]], [[a,d],[b,c]] ];}
  const out=[];

function chooseTeamPairings(s,chosen){

      score += Math.abs(teamRank(a,s)-teamRank(b,s))*0.000001;

  }

function newTeamMexicanoRound(s){

  const eligibleTeams=s.teams.filter(t=>t.playerIds.every(id=>activeSet.has(id)));
  const playCount=Math.min(eligibleTeams.length,Math.floor(s.courts*2));

function setPairScore(i,side,v){const s=cur();if(!s||s.status==='finished')return toast('Session is finished — reopen it to edit');const m=s.matches[i];m.pairScore=m.pairScore||[null,null];m.pairScore[side]=v;if(s.scoreMode==='points'||(s.scoreMode==='normal'&&(s.scoreRule||'').startsWith('total')))m.pairScore[1-side]=scoreLimit(s)-v;if(isAmericano(s))syncAmericanoCurrent(s);save();closePanel();render()}
function roundNumbers(s){const total=isAmericano(s)?(s.americanoSchedule?.length||s.round):s.round;return Array.from({length:total},(_,i)=>i+1)}
function viewRound(n){const s=cur();if(isAmericano(s)&&s.americanoSchedule?.[n-1])return selectAmericanoRound(n);const r=s.rounds.find(x=>x.number===n);if(r){openPanel(`<div class="sheet-head"><h2>Round #${n}</h2><button class="close" onclick="closePanel()">×</button></div><div class="notice">${s.status==='finished'?'Finished session · read-only results. Reopen the session to edit scores.':'Completed round · tap a score to correct it.'}</div>${r.matches.map((m,i)=>matchCardHistory(s,m,i,n)).join('')}<div class="rest-pill">☕ Rest: ${r.restIds?.map(id=>s.players.find(p=>p.id===id)?.name).filter(Boolean).map(esc).join(', ')||'None'}</div>`);return}toast('Round not available')}
function matchCardHistory(s,m,i,n){const a=(m.t1||[]).map(id=>s.players.find(p=>p.id===id)),b=(m.t2||[]).map(id=>s.players.find(p=>p.id===id)),score=m.pairScore||[null,null],editable=isAmericano(s)||n<=s.round;return `<section class="match"><div class="court-row"><span class="court">Court ${m.court}</span></div><div class="match-grid"><div class="team">${a.map(p=>esc(p?.name||'—')).join('<br>')}</div><div class="score-pair">${score.map((v,side)=>`<button class="${v!==null?'set':''}" ${editable?`onclick="${isAmericano(s)?`pairScoreModal(${i},${side})`:`historyScore(${n},${i},${side})`}"`:'disabled'}>${v===null?'--':v}</button>`).join('')}</div><div class="team right">${b.map(p=>esc(p?.name||'—')).join('<br>')}</div></div></section>`}
function historyScore(n,i,side){const s=cur();if(!s||s.status==='finished')return toast('Session is finished — reopen it to edit');const r=s.rounds.find(x=>x.number===n),m=r.matches[i],nmax=scoreLimit(s),current=(m.pairScore||[null,null])[side];const names=(side?m.t2:m.t1).map(id=>s.players.find(p=>p.id===id)?.name||'—').join(' & ');openPanel(`<div class="sheet-head"><div><div class="score-title">${esc(names)}</div><div class="score-sub">Round #${n}</div></div><button class="close" onclick="closePanel()">×</button></div><div class="score-grid">${Array.from({length:nmax+1},(_,v)=>`<button class="${current===v?'selected':''}" onclick="setHistoryScore(${n},${i},${side},${v})">${v}</button>`).join('')}</div>`)}
function setHistoryScore(n,i,side,v){const s=cur();if(!s||s.status==='finished')return toast('Session is finished — reopen it to edit');const r=s.rounds.find(x=>x.number===n);r.matches[i].pairScore=r.matches[i].pairScore||[null,null];r.matches[i].pairScore[side]=v;recalcStats(s);save();closePanel();render();toast('Score corrected')}
function allCompletedMatches(s){const completed=isAmericano(s)?(s.americanoSchedule||[]).flatMap(r=>r.matches||[]):(s.rounds||[]).flatMap(r=>r.matches||[]);return completed.filter(m=>m.pairScore&&m.pairScore[0]!=null&&m.pairScore[1]!=null)}
function recalcStats(s){s.players.forEach(p=>{p.w=0;p.l=0;p.ties=0;p.p=0;p.played=0;p.diff=0});allCompletedMatches(s).forEach(m=>{const [a,b]=m.pairScore;[m.t1,m.t2].forEach((ids,side)=>ids.filter(Boolean).forEach(id=>{const p=s.players.find(x=>x.id===id);if(!p)return;const x=side===0?a:b,y=side===0?b:a;p.played++;p.p+=x;p.diff+=x-y;if(x>y)p.w++;else if(x<y)p.l++;else p.ties++}))})}
function recordHistories(s,round){s.teamHistory=s.teamHistory||{};round.matches.forEach(m=>{if(m.t1?.every(Boolean)){incHist(s.partnerHistory,m.t1[0],m.t1[1])}if(m.t2?.every(Boolean)){incHist(s.partnerHistory,m.t2[0],m.t2[1])}if(m.teamMatch&&m.t1?.every(Boolean)&&m.t2?.every(Boolean)){const ta=s.teams.find(t=>t.playerIds.every(id=>m.t1.includes(id))),tb=s.teams.find(t=>t.playerIds.every(id=>m.t2.includes(id)));if(ta&&tb)incHist(s.teamHistory,ta.id,tb.id)}if(m.t1?.every(Boolean)&&m.t2?.every(Boolean))m.t1.forEach(a=>m.t2.forEach(b=>incHist(s.opponentHistory,a,b)))})}
function incHist(obj,a,b){obj[a]=obj[a]||{};obj[b]=obj[b]||{};obj[a][b]=(obj[a][b]||0)+1;obj[b][a]=(obj[b][a]||0)+1}
function finish(){const s=cur();if(!s.matches.length)return toast('No matches in this round');if(s.matches.some(m=>!m.pairScore||m.pairScore[0]==null||m.pairScore[1]==null))return toast('Enter both pair scores first');const frozen={number:s.round,matches:JSON.parse(JSON.stringify(s.matches)),restIds:[...dynamicRest(s)]};s.rounds=s.rounds||[];s.rounds.push(frozen);recalcStats(s);recordHistories(s,frozen);if(s.type==='Americano'||s.type==='Team Americano'){const next=s.round;if(next<s.americanoSchedule.length)applyScheduleRound(s,next);else{s.status='finished';toast(s.type+' complete')}}else if(s.type==='Team Mexicano')newTeamMexicanoRound(s);else newRound();save();render()}
function finishSession(){const s=cur();if(!s)return;s.status='finished';save();S.current=null;render();toast('Session finished')}
function playerModal(){const s=cur(),locked=s.status==='finished';openPanel(`<div class="sheet-head"><div><h2>Players</h2>${locked?'<div class="small muted">Finished session · player status is locked.</div>':''}</div><button class="close" onclick="closePanel()">×</button></div>${s.players.map(p=>`<div class="playerline"><span class="name">${esc(p.name)}</span><button class="status ${p.active?'active':'away'}${locked?' is-locked':''}" ${locked?'disabled':''} onclick="togglePlayer(${p.id})">${p.active?'Active':'Away'}</button></div>`).join('')}`)}
function removeSetupPair(startIndex){const s=cur();if(!s)return;const ids=s.players.slice(startIndex,startIndex+2).map(p=>p.id);s.players=s.players.filter(p=>!ids.includes(p.id));s.playerCount=s.players.length;s.teams=[];for(let i=0;i<s.players.length;i+=2)if(s.players[i+1])s.teams.push({id:i/2+1,name:'Team '+(i/2+1),playerIds:[s.players[i].id,s.players[i+1].id]});save();playersSetup(s);toast('Pair removed')}
function togglePlayer(id){const s=cur();if(!s||s.status==='finished')return toast('Session is finished — reopen it to edit');const p=s.players.find(x=>x.id===id);if(!p)return;p.active=!p.active;if(!p.active){s.matches.forEach(m=>{if(!(m.t1.includes(id)||m.t2.includes(id)))return;const candidates=dynamicRest(s).map(x=>s.players.find(q=>q.id===x)).filter(Boolean);const replacement=candidates[0];if(replacement){m.t1=m.t1.map(x=>x===id?replacement.id:x);m.t2=m.t2.map(x=>x===id?replacement.id:x)}else{m.t1=m.t1.map(x=>x===id?null:x);m.t2=m.t2.map(x=>x===id?null:x)}m.pairScore=[null,null]})}s.rest=dynamicRest(s);save();closePanel();render();playerModal();toast(p.active?'Player active':'Player away — updated')}
function swapPlayers(i){const s=cur();if(!s||s.status==='finished')return toast('Session is finished — reopen it to edit');const m=s.matches[i];openPanel(`<div class="sheet-head"><h2>Switch player</h2><button class="close" onclick="closePanel()">×</button></div><div class="small muted">Choose the player leaving this match. You can switch with a rested player or an active player on another court.</div>${[...m.t1,...m.t2].filter(Boolean).map(id=>{const p=s.players.find(x=>x.id===id);return `<button class="btn secondary" style="width:100%;margin:5px 0;text-align:left" onclick="chooseReplacement(${i},${id})">${esc(p.name)}</button>`}).join('')}`)}
function chooseReplacement(i,out){const s=cur();if(!s||s.status==='finished')return toast('Session is finished — reopen it to edit');const m=s.matches[i];const currentIds=new Set([...m.t1,...m.t2].filter(Boolean));const candidates=s.players.filter(p=>p.active&&!currentIds.has(p.id));openPanel(`<div class="sheet-head"><h2>Replace with</h2><button class="close" onclick="closePanel()">×</button></div>${candidates.length?candidates.map(p=>{const loc=s.matches.findIndex(x=>[...(x.t1||[]),...(x.t2||[])].includes(p.id));return `<button class="btn secondary" style="width:100%;margin:5px 0;text-align:left" onclick="doSwap(${i},${out},${p.id})">${esc(p.name)} <span class="small muted">${loc>=0?'· Court '+s.matches[loc].court:'· Rest'}</span></button>`}).join(''):'<p class="muted">No other active players available.</p>'}`)}
function doSwap(i,out,inn){const s=cur();if(!s||s.status==='finished')return toast('Session is finished — reopen it to edit');const m=s.matches[i];const otherIdx=s.matches.findIndex((x,idx)=>idx!==i&&[...(x.t1||[]),...(x.t2||[])].includes(inn));if(otherIdx>=0){const om=s.matches[otherIdx];const replaceIn=(arr)=>arr.map(x=>x===inn?out:x);om.t1=replaceIn(om.t1);om.t2=replaceIn(om.t2);om.pairScore=[null,null]}m.t1=m.t1.map(x=>x===out?inn:x);m.t2=m.t2.map(x=>x===out?inn:x);m.pairScore=[null,null];s.rest=dynamicRest(s);save();closePanel();render();toast('Player switched')}
function matchRound(s,m){for(const r of s.rounds||[])if(r.matches?.some(x=>x===m||JSON.stringify(x)===JSON.stringify(m)))return r.number;for(const r of s.americanoSchedule||[])if(r.matches?.some(x=>x===m||JSON.stringify(x)===JSON.stringify(m)))return r.number;return '?'}function playerStats(id){const s=cur(),p=s.players.find(x=>x.id===id);if(!p)return;const matches=allCompletedMatches(s).filter(m=>[...(m.t1||[]),...(m.t2||[])].includes(id));const winRate=p.played?Math.round(p.w/p.played*100):0;const partnerStats={};matches.forEach(m=>{const side=m.t1.includes(id)?0:1;const team=side===0?m.t1:m.t2;const my=m.pairScore?.[side],opp=m.pairScore?.[1-side];if(my==null||opp==null)return;team.filter(x=>x!==id).forEach(x=>{const st=partnerStats[x]||{games:0,wins:0,losses:0,ties:0};st.games++;if(my>opp)st.wins++;else if(my<opp)st.losses++;else st.ties++;partnerStats[x]=st})});let candidates=Object.entries(partnerStats);const reliable=candidates.filter(([,st])=>st.games>=2);if(reliable.length)candidates=reliable;const partnerRows=candidates.sort((a,b)=>{const ar=a[1].games? a[1].wins/a[1].games:0,br=b[1].games? b[1].wins/b[1].games:0;return (br-ar)||(b[1].games-a[1].games)||(b[1].wins-a[1].wins)}).slice(0,5);const maxRate=partnerRows[0]?.[1].games?partnerRows[0][1].wins/partnerRows[0][1].games:1;const history=matches.slice().reverse().slice(0,15).map((m,idx)=>{const side=m.t1.includes(id)?0:1;const my=m.pairScore[side],opp=m.pairScore[1-side];const partner=(side?m.t2:m.t1).filter(x=>x!==id).map(x=>s.players.find(p=>p.id===x)?.name).join(' & ');const r=matchRound(s,m);const cls=my>opp?'result-win':my<opp?'result-loss':'result-tie';const txt=my>opp?'W':my<opp?'L':'T';return `<div class="history-row"><span>R${r} · ${esc(partner||'Solo')}</span><span>${my}-${opp} <b class="${cls}">${txt}</b></span></div>`}).join('');openPanel(`<div class="sheet-head"><div><h2>${esc(p.name)}</h2><div class="small muted">Player statistics</div></div><div style="display:flex;gap:7px"><button class="btn secondary" onclick="editPlayerName(${p.id})">Edit name</button><button class="close" onclick="closePanel()">×</button></div></div><div class="stat-grid"><div class="stat"><b>${p.played}</b><span>Games played</span></div><div class="stat"><b>${p.w}</b><span>Wins</span></div><div class="stat"><b>${p.l}</b><span>Losses</span></div><div class="stat"><b>${p.ties}</b><span>Ties</span></div><div class="stat"><b>${winRate}%</b><span>Win rate</span></div><div class="stat"><b>${p.p}</b><span>Points</span></div></div><h3 style="font-size:14px;font-weight:500;margin:5px 0 7px">Match history</h3><div class="history">${history||'<div class="notice">No completed matches yet.</div>'}</div><h3 style="font-size:14px;font-weight:500;margin:16px 0 7px">Best partners</h3>${isTeam(s)?`<div class="team-lock">Fixed team partner: ${esc((s.teams.find(t=>t.playerIds.includes(id))?.playerIds||[]).filter(x=>x!==id).map(x=>s.players.find(q=>q.id===x)?.name).join(' & ')||'—')}</div>`:''}<div class="partner-chart">${partnerRows.length?partnerRows.map(([pid,st])=>{const n=s.players.find(x=>x.id===+pid)?.name||'Unknown';const rate=st.games?Math.round(st.wins/st.games*100):0;const width=maxRate?Math.round((st.wins/st.games)/maxRate*100):0;return `<div class="partner-row"><div><div class="partner-name">${esc(n)}</div><div class="bar-wrap"><div class="bar" style="width:${width}%"></div></div></div><div class="partner-count">${rate}% · ${st.games}g</div></div>`}).join(''):'<div class="notice">No partner history yet.</div>'}</div>`)}
function editPlayerName(id){const s=cur(),p=s.players.find(x=>x.id===id);if(!p)return;openPanel(`<div class="sheet-head"><h2>Edit player name</h2><button class="close" onclick="closePanel()">×</button></div><div class="field"><label>PLAYER NAME</label><input id="editName" value="${esc(p.name)}" autofocus></div><button class="btn primary" style="width:100%" onclick="savePlayerName(${id})">Save name</button>`)}
function savePlayerName(id){const s=cur(),p=s.players.find(x=>x.id===id),v=$('editName')?.value.trim();if(!p||!v)return toast('Enter a player name');p.name=v;save();closePanel();render();toast('Player name updated')}
function reopenSession(){const s=cur();if(!s||s.status!=='finished')return;if(!confirm('Reopen this finished session? Previous results will remain, and editing will be enabled again.'))return;s.status='live';save();render();toast('Session reopened — editing enabled')}
function session(s){const nums=roundNumbers(s),restIds=dynamicRest(s),rest=restIds.map(id=>s.players.find(p=>p.id===id)).filter(Boolean),americano=isAmericano(s),finished=s.status==='finished',complete=americano?americanoAllComplete(s):(s.matches.length&&s.matches.every(m=>m.pairScore&&m.pairScore[0]!=null&&m.pairScore[1]!=null));$('view').innerHTML=`<div class="session-head"><div class="row" style="margin-bottom:8px"><button class="btn secondary" onclick="S.current=null;save();render()">← Dashboard</button><div style="display:flex;gap:7px">${finished?'<button class="btn secondary" onclick="reopenSession()">Reopen</button><button class="btn secondary" onclick="shareCurrentSession()">Share</button>':'<button class="btn secondary" onclick="finishSession()">Finish session</button>'}</div></div><div class="session-title">${esc(s.name)}</div><div class="session-type">${esc(s.type)}${isMexicano(s)&&!isMixicano(s)?' · Smart':isMixicano(s)?' · '+(s.pairConstraint==='side'?'Left + Right':'Male + Female'):''}</div><div class="session-meta">${s.playerCount} players · ${s.courts} courts · ${ruleText(s)}${s.place?' · '+esc(s.place):''}</div>${finished?'<div class="readonly-note" style="margin-top:10px">Finished session · read-only. Reopen to edit scores, players, or generate more rounds.</div>':''}</div><div class="tabs"><button class="tab active">Matches</button><button class="tab" onclick="leaderboard()">Leaderboard</button><button class="tab" onclick="playerModal()">Players</button></div><div class="roundbar"><div class="roundtitle">Round #${s.round}</div><button class="help">?</button><button class="btn secondary ${finished?'is-locked':''}" ${finished?'disabled':''} style="margin-left:auto" onclick="playerModal()">Edit Players</button></div><div class="rounds">${nums.map(n=>`<button class="roundpill ${n===s.round?'active':''}" onclick="viewRound(${n})">${n}</button>`).join('')}</div>${s.matches.map((m,i)=>matchCard(s,m,i)).join('')}${rest.length?`<div class="rest-pill">☕ Rest: ${rest.map(p=>esc(p.name)).join(', ')}</div>`:''}${awayPlayers(s).length?`<div class="away-pill">✕ Away: ${awayPlayers(s).map(p=>esc(p.name)).join(', ')}</div>`:''}${finished?'':`${americano?`<div style="display:flex;gap:8px;margin:4px 0 10px"><button class="btn secondary" style="flex:1" onclick="generateMoreAmericano()">＋ Generate more rounds</button></div>`:''}<div class="bottom-action"><button ${complete?'':'disabled'} onclick="${americano?'finishAmericano()':'finish()'}">${americano?'Finish Americano':'Next Round →'}</button></div>`}`}
function legacyPublicData(){return location.hash.startsWith('#data=')?decodeResult(location.hash.slice(6)):null}
async function loadPublicResult(){
  const legacy=legacyPublicData();if(legacy)return legacy;
  const m=location.pathname.match(/^\/results\/([A-Za-z0-9_-]{20,32})\/?$/);if(!m)return null;
  const id=m[1];
  try{
    const res=await fetch('/.netlify/functions/share-get?id='+encodeURIComponent(id),{cache:'no-store'});
    const data=await res.json().catch(()=>null);
    if(!res.ok||!data||data.error)throw new Error(data?.error||'Result not found');
    return data;
  }catch(e){
    console.error('share-get client error',e);
    $('view').classList.add('public-view');
    $('view').innerHTML='<section class="card" style="margin-top:24px"><h2 style="margin-top:0">Result not found</h2><p class="muted">This shared session may have expired or the link is invalid.</p><button class="btn secondary" onclick="location.href=location.origin">Back to Padel Round</button></section>';
    return null;
  }
}
async function render(){if(location.pathname.startsWith('/results/')){const pub=await loadPublicResult();if(pub)return renderPublicResults(pub);return;}$('view').classList.remove('public-view');const s=cur();if(!s)return dashboard();ensureSession(s);if(s.status==='setup')playersSetup(s);else session(s)}
render();
</script></body></html>
